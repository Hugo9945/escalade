  <title>Carte des voies – Sac à topos</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%232ec4b6'/%3E%3Ccircle cx='44' cy='20' r='10' fill='%23ffd23f' stroke='%231b1b1b' stroke-width='3'/%3E%3Cpath d='M6 56 L24 24 L36 42 L44 32 L58 56 Z' fill='%23ff5d8f' stroke='%231b1b1b' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="page-carte">
  <header class="entete">
    <a class="logo" href="index.html">Sac à topos</a>
    <nav>
      <a href="index.html" class="actif">Carte</a>
      <a href="projets.html">Projets</a>
    </nav>
  </header>
  <main>
    <details class="filtres" id="filtres" open>
      <summary>Filtres</summary>
      <div class="filtres-contenu">
      <fieldset id="filtre-statuts"><legend>Statut</legend></fieldset>
      <label class="projet">Équipement
        <select id="filtre-equipement">
          <option value="">Tous</option>
          <option value="equipee">● Équipée</option>
          <option value="semi">◆ Semi-équipée</option>
          <option value="trad">▲ Trad</option>
        </select>
      </label>
      <label class="projet">Envie
        <select id="filtre-envie">
          <option value="0">Toutes</option>
          <option value="1">★ et plus</option>
          <option value="2">★★ et plus</option>
          <option value="3">★★★</option>
        </select>
      </label>
      <label class="projet">Projet
        <select id="filtre-projet"><option value="">Tous</option></select>
      </label>
      </div>
    </details>
    <div id="carte"></div>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/commun.js?v=13"></script>
  <script src="js/carte.js?v=13"></script>
</body>
</html>
